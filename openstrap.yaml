# yaml-language-server: $schema=../openstrap/schemas/openstrap-blueprint.schema.json
# Cloud-init prepares the Control Plane; OpenStrap runs its workstation playbook.
targets:
  bootstrap-target:
    displayName: Bootstrap workstation target
    provider: virtualbox
    transport: ssh
    user: textyre
    identity: { secret: ARCH_BASE_SSH_KEY }
    sudoPassword: { secret: BOOTSTRAP_TARGET_SUDO_PASSWORD }
    source: { machine: arch-base, snapshot: base, mode: full }
    network:
      shared: { name: bootstrap, address: 172.28.51.10, cidr: 24 }
    size: large
    display: false
  ansible-control:
    displayName: Ansible Control Plane
    provider: virtualbox
    transport: ssh
    image: cloud-image/ubuntu-24.04
    size: large
    display: false
    network:
      shared: { name: bootstrap, address: 172.28.51.11, cidr: 24 }
    cloudInit:
      file: cloud-init/ansible-control.yaml
      timeoutMs: 1800000
    ansible:
      target: bootstrap-target
      # master's image by default; another branch's with BOOTSTRAP_IMAGE_TAG=branch-<branch> (or sha-<commit>).
      image: ghcr.io/textyre/bootstrap/control-plane:${BOOTSTRAP_IMAGE_TAG:-latest}
      playbook: playbooks/workstation.yml
