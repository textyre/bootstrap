version: '3'

vars:
  # Optional developer Tasks; OpenStrap calls Docker directly on its VM.
  PUBLIC_ENV: COMPOSE_DISABLE_ENV_FILE,CONTROL_PLANE_IMAGE,CONTROL_PLANE_ARA_PORT
  EXEC_ENV: BOOTSTRAP_TARGET_HOST,BOOTSTRAP_TARGET_PORT,BOOTSTRAP_TARGET_USER,BOOTSTRAP_TARGET_PRIVATE_KEY,BOOTSTRAP_VAULT_PASSWORD
  DOCKER: '{{.CONTROL_PLANE_RUNTIME | default (printf "sudo --non-interactive --preserve-env=%s docker" .PUBLIC_ENV)}}'
  EXEC_DOCKER: '{{.CONTROL_PLANE_RUNTIME | default (printf "sudo --non-interactive --preserve-env=%s,%s docker" .PUBLIC_ENV .EXEC_ENV)}}'
  COMPOSE_ARGS: 'compose --project-directory "{{.TASKFILE_DIR}}" --file "{{.TASKFILE_DIR}}/compose.yml"'
  COMPOSE: '{{.DOCKER}} {{.COMPOSE_ARGS}}'
  EXEC: '{{.EXEC_DOCKER}} {{.COMPOSE_ARGS}} exec --env {{.EXEC_ENV | splitList "," | join " --env "}}'
  PREFIX: '{{.EXEC}} -T control-plane'
  ANSIBLE: '{{.PREFIX}} ansible-playbook'
  PLAYBOOK: playbooks/workstation.yml

env:
  COMPOSE_DISABLE_ENV_FILE: '1'

tasks:
  default:
    desc: Show available commands
    cmds:
      - task --list
    silent: true

  controller:prepare:
    aliases: [bootstrap]
    desc: Pull and start the ready Ansible container
    cmds:
      - '{{.COMPOSE}} pull control-plane'
      - '{{.COMPOSE}} up --detach --force-recreate --no-build --pull never control-plane'

  workstation:
    aliases: [run]
    desc: Configure the target with the workstation playbook
    cmds:
      - '{{.ANSIBLE}} {{.PLAYBOOK}} {{.CLI_ARGS}}'

  dry-run:
    desc: Preview workstation changes
    cmds:
      - '{{.ANSIBLE}} {{.PLAYBOOK}} --check --diff {{.CLI_ARGS}}'

  check:
    desc: Check workstation playbook syntax
    cmds:
      - '{{.ANSIBLE}} {{.PLAYBOOK}} --syntax-check'

  lint:
    desc: Run ansible-lint
    cmds:
      - '{{.PREFIX}} ansible-lint playbooks/ roles/'

  lint:openstrap:
    desc: Lint the workstation entry point and changed user roles
    cmds:
      - '{{.PREFIX}} ansible-lint playbooks/workstation.yml roles/user/ roles/chezmoi/'

  test:
    aliases:
      - test-timezone
      - test-locale
      - test-hostname
      - test-hostctl
      - test-vconsole
      - test-ntp
      - test-ntp-audit
      - test-vm
      - test-sysctl
      - test-reflector
      - test-yay
      - test-bootloader
      - test-limine
      - test-system-update
      - test-packages
      - test-user
      - test-ssh
      - test-git
      - test-shell
      - test-docker
      - test-firewall
      - test-caddy
      - test-vaultwarden
      - test-xorg
      - test-lightdm
      - test-greeter
      - test-chezmoi
      - test-zen-browser
    desc: Molecule role tests run in the existing CI workflows
    cmds:
      - 'echo "Molecule is not installed in the controller image. Role tests run in .github/workflows/molecule.yml and molecule-vagrant.yml." >&2'
      - exit 2

  ara:
    desc: Serve Ansible results at localhost:8000
    cmds:
      - '{{.PREFIX}} ara-manage runserver 0.0.0.0:8000'

  vault-view:
    desc: View decrypted credentials
    cmds:
      - '{{.PREFIX}} ansible-vault view inventory/group_vars/all/vault.yml'
