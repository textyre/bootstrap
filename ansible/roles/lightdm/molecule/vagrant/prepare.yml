---
- name: Prepare Vagrant guest
  ansible.builtin.import_playbook: ../../../../molecule/shared/prepare-vagrant.yml

- name: Prepare LightDM runtime
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Install LightDM runtime on Arch Linux
      community.general.pacman:
        name:
          - lightdm
          - lightdm-gtk-greeter
          - xorg-server
        state: present
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Install LightDM runtime on Ubuntu
      ansible.builtin.apt:
        name:
          - lightdm
          - lightdm-gtk-greeter
          - xserver-xorg
        state: present
      environment:
        DEBIAN_FRONTEND: noninteractive
      when: ansible_facts['os_family'] == 'Debian'

    - name: Select the installed greeter for the test machine
      community.general.ini_file:
        path: /etc/lightdm/lightdm.conf
        section: "Seat:*"
        option: greeter-session
        value: lightdm-gtk-greeter
        mode: "0644"
        no_extra_spaces: true
