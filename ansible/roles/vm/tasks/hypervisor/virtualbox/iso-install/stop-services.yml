---
- name: "VirtualBox: Gather service facts"
  ansible.builtin.service_facts:

# systemd keeps listing a unit whose file is gone (status not-found), for example after an
# uninstall that did not finish; such a unit has nothing to stop.
- name: "VirtualBox: Stop the Guest Additions services"
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
  loop: [vboxservice, vboxadd-service]
  when: >-
    (ansible_facts['services'][item ~ '.service']
     | default(ansible_facts['services'][item] | default({'status': 'not-found'})))
    .get('status', 'unknown') != 'not-found'
