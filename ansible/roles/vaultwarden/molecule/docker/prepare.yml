---
- name: Bootstrap Docker container
  ansible.builtin.import_playbook: ../../../../molecule/shared/prepare-docker.yml

- name: Prepare Vaultwarden test prerequisites
  hosts: all
  become: true
  gather_facts: true
  vars:
    _vaultwarden_test_packages:
      Archlinux:
        - docker
        - docker-compose
        - fuse-overlayfs
        - python-requests
        - ca-certificates
      Debian:
        - docker.io
        - docker-compose-v2
        - python3-requests
        - ca-certificates

  tasks:
    - name: Install Vaultwarden test prerequisites
      ansible.builtin.package:
        name: "{{ _vaultwarden_test_packages[ansible_facts['os_family']] }}"
        state: present

    - name: Configure Vaultwarden Docker runtime prerequisite
      ansible.builtin.include_role:
        name: docker
      vars:
        # Vaultwarden tests need a working daemon prerequisite, not Docker
        # hardening coverage. The docker role tests own userns-remap.
        docker_userns_remap: ""
        docker_storage_driver: >-
          {{
            'fuse-overlayfs'
            if ansible_facts['os_family'] == 'Archlinux'
            else 'overlay2'
          }}
