---
- name: Prepare Vaultwarden virtual machines
  ansible.builtin.import_playbook: ../../../../molecule/shared/prepare-vagrant.yml

- name: Install Vaultwarden runtime test prerequisite
  hosts: all
  become: true
  gather_facts: true
  vars:
    _vaultwarden_test_docker_packages:
      Archlinux:
        - docker
        - docker-compose
        - fuse-overlayfs
        - python-requests
        - ca-certificates
      Debian:
        - docker.io
        - docker-compose-v2
        - python3-requests
        - ca-certificates
  tasks:
    - name: Keep Docker interfaces unmanaged by systemd-networkd
      ansible.builtin.copy:
        dest: /etc/systemd/network/10-docker-unmanaged.network
        owner: root
        group: root
        mode: '0644'
        content: |
          [Match]
          Name=docker* br-* veth*

          [Link]
          Unmanaged=yes
      register: _vaultwarden_test_networkd_configuration
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Reload systemd-networkd test configuration
      ansible.builtin.systemd_service:
        name: systemd-networkd
        state: reloaded
      when:
        - ansible_facts['os_family'] == 'Archlinux'
        - _vaultwarden_test_networkd_configuration is changed

    - name: Install Docker Engine and Compose
      ansible.builtin.package:
        name: "{{ _vaultwarden_test_docker_packages[ansible_facts['os_family']] }}"
        state: present

    - name: Configure Vaultwarden Docker runtime prerequisite
      block:
        - name: Apply Docker role for Vaultwarden test runtime
          ansible.builtin.include_role:
            name: docker
          vars:
            # Vaultwarden tests need a working daemon prerequisite, not Docker
            # hardening coverage. The docker role tests own userns-remap.
            docker_userns_remap: ""
            docker_storage_driver: >-
              {{
                'fuse-overlayfs'
                if ansible_facts['os_family'] == 'Archlinux'
                else docker_storage_driver
              }}

      rescue:
        - name: Collect Docker service status after prerequisite failure
          ansible.builtin.command:
            cmd: systemctl status docker.service --no-pager --lines=80
          register: _vaultwarden_test_docker_status
          changed_when: false
          failed_when: false

        - name: Collect Docker journal after prerequisite failure
          ansible.builtin.command:
            cmd: journalctl -u docker.service --no-pager --lines=160
          register: _vaultwarden_test_docker_journal
          changed_when: false
          failed_when: false

        - name: Report Docker prerequisite diagnostics
          ansible.builtin.fail:
            msg:
              - "Docker runtime prerequisite failed before vaultwarden role converge."
              - "{{ _vaultwarden_test_docker_status.stdout_lines }}"
              - "{{ _vaultwarden_test_docker_journal.stdout_lines }}"
