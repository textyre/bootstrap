---
# nvm and the newest stable Node for the target user.
nvm_user: "{{ target_user }}"
nvm_version: "v0.41.0"            # a tag of github.com/nvm-sh/nvm
nvm_node_version: latest          # latest: the newest stable release; or an exact version, e.g. v26.13.1
nvm_node_index_url: "https://nodejs.org/dist/index.tab"
nvm_global_packages: [pnpm]       # npm packages installed into that Node
# Remove the distribution's Node, npm and pnpm, so only nvm's Node is on PATH.
nvm_remove_system_node: false
nvm_system_node_packages: [nodejs, nodejs-lts-iron, nodejs-lts-jod, nodejs-lts-krypton, npm, pnpm]
