---
# Released ctOS greeter artifact deployed to the workstation.
greeter_version: "1.0.0"
greeter_artifact_url: "https://github.com/textyre/ctos-greeter/releases/download/v{{ greeter_version }}/ctos-greeter.tar"
greeter_artifact_checksum: "sha256:8f2429c7d82156f27a47d5363282baa01e38b6c2bc210e818d5945e9de82f266"

# nody-greeter, the LightDM greeter engine (Arch): built from the AUR by the greeter role itself.
# nody-greeter is no longer developed; it is Electron 27, which builds only with Node 20 or older.
# That Node comes from nvm for the build alone and is removed after it; the system keeps none.
greeter_nody_enabled: "{{ ansible_facts['os_family'] == 'Archlinux' }}"
greeter_nody_package_version: "1.6.2-2"          # pkgver-pkgrel of the AUR package
greeter_nody_aur_url: "https://aur.archlinux.org/nody-greeter.git"
greeter_nody_build_user: "{{ yay_builder_user | default('aur_builder') }}"
greeter_nody_build_node: "20"
greeter_nody_nvm_version: "{{ nvm_version | default('v0.41.0') }}"
greeter_nody_keep_build_node: false
# npm 12 blocks dependency install scripts unless they are approved; the build needs these.
greeter_nody_npm_allow_scripts:
  - electron@27.3.11
  - esbuild@0.21.5
  - node-gtk@0.14.0
