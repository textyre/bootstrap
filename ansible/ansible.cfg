[defaults]
roles_path = roles:playbooks/roles:~/.ansible/roles:/usr/share/ansible/roles
inventory = inventory/openstrap.yml
stdout_callback = default
callback_plugins = callback_plugins:/opt/ansible/ara-callback
callbacks_enabled = ara_default
retry_files_enabled = False
# OpenSSH remembers new target keys and rejects changed keys.
host_key_checking = True
localhost_warning = False
inventory_ignore_extensions = .pyc, .pyo, .swp, .bak, ~, .rpm, .md, .txt, .orig, .ini~

[inventory]
enable_plugins = yaml, ini, host_list, auto
