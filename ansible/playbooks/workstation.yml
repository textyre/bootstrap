---
# Полная настройка рабочей станции после установки ОС.
#
# Публичный запуск:
#   task workstation
#
# Dry-run:
#   task dry-run
#
# Пароль sudo зашифрован в inventory/group_vars/all/vault.yml (Ansible Vault).
# OpenStrap provides target access and Vault credentials through the environment.

- name: Setup workstation
  hosts: workstations
  become: true
  gather_facts: false

  pre_tasks:
    # Bare Arch snapshots may have SSH but no Python for native modules yet.
    - name: Probe Python without requiring Python
      ansible.builtin.raw: test -x /usr/bin/python3
      become: false
      register: _workstation_python_probe
      changed_when: false
      failed_when: _workstation_python_probe.rc not in [0, 1]
      check_mode: false
      tags: [always]

    # The keyring exception is immediately followed by a full Arch upgrade.
    - name: Install Python on a bare Arch target
      ansible.builtin.raw: >-
        test -f /etc/arch-release &&
        pacman -Sy --needed --noconfirm archlinux-keyring &&
        pacman -Su --needed --noconfirm python inetutils
      register: _workstation_python_install
      when: _workstation_python_probe.rc == 1
      changed_when: _workstation_python_install.rc == 0
      tags: [always]

    - name: Gather workstation facts
      ansible.builtin.setup:
      tags: [always]

  roles:
    # --- Phase -1: Mirror setup ---
    - role: reflector
      tags: [reflector, pacman, mirrors]

    # --- Phase 0: Package infrastructure ---
    - role: package_manager
      tags: [packages, pacman]

    # Workstation package set only. Full OS upgrade belongs to system_update.
    - role: packages
      tags: [packages, install]

    # --- Phase 1: System foundation ---
    - role: timezone
      tags: [system, timezone]

    - role: locale
      tags: [system, locale]

    - role: hostname
      tags: [system, hostname]

    - role: hostctl
      tags: [system, hostctl]

    - role: vconsole
      tags: [system, vconsole]

    - role: ntp
      tags: [system, ntp]

    - role: ntp_audit
      tags: [system, ntp, ntp_audit]

    - role: pam_hardening
      tags: [pam, security, hardening]

    - role: vm
      tags: [vm, vbox, vmware, hyperv]

    # --- Phase 1.5: Hardware & Kernel ---
    - role: gpu_drivers
      tags: [gpu, drivers, hardware]

    - role: sysctl
      tags: [sysctl, kernel, tuning]

    - role: power_management
      tags: [power, tlp, battery]

    # --- Phase 2: User & access ---
    - role: user
      tags: [user]

    - role: ssh_keys
      tags: [ssh_keys, security]

    - role: teleport
      tags: [teleport, security]

    - role: ssh
      tags: [ssh, security]

    - role: fail2ban
      tags: [fail2ban, security]

    # --- Phase 4: Development tools ---
    - role: git
      tags: [git]

    - role: shell
      tags: [shell]

    # --- Phase 5: Services ---
    - role: docker
      tags: [docker]

    - role: firewall
      tags: [firewall, security]

    - role: caddy
      tags: [caddy, proxy, security]

    - role: vaultwarden
      tags: [vaultwarden, security, secrets]

    # --- Phase 6: Desktop environment ---
    - role: xorg
      tags: [xorg, display]

    - role: greeter
      tags: [greeter, display]

    - role: lightdm
      tags: [lightdm, display]

    - role: zen_browser
      tags: [zen_browser, browser]

    # --- Phase 7: User dotfiles ---
    - role: chezmoi
      tags: [chezmoi, dotfiles]
